<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticky Wall — Task & Notes Dashboard</title>
  
  <!-- Modern Typography (Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Outer Viewport Wrapper (Soft Sage Background) -->
  <div class="viewport-wrapper">

    <!-- Main Container Card -->
    <div class="app-card">
      
      <!-- Left Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-top">
          <!-- Menu Header -->
          <div class="sidebar-header">
            <h2>Menu</h2>
            <button class="hamburger-btn" id="menuToggleBtn" title="Toggle Menu">≡</button>
          </div>

          <!-- Search Input -->
          <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="sidebarSearchInput" placeholder="Search" autocomplete="off">
          </div>

          <!-- Tasks Section -->
          <div class="nav-section">
            <div class="section-title">TASKS</div>
            <ul class="nav-list">
              <li class="nav-item" data-view="upcoming">
                <span class="nav-label"><span class="icon">»</span> Upcoming</span>
                <span class="count-badge" id="countUpcoming">12</span>
              </li>
              <li class="nav-item" data-view="today">
                <span class="nav-label"><span class="icon">≡</span> Today</span>
                <span class="count-badge" id="countToday">5</span>
              </li>
              <li class="nav-item" data-view="calendar">
                <span class="nav-label"><span class="icon">📅</span> Calendar</span>
              </li>
              <li class="nav-item active" data-view="sticky-wall">
                <span class="nav-label"><span class="icon">📌</span> Sticky Wall</span>
              </li>
            </ul>
          </div>

          <!-- Lists Section -->
          <div class="nav-section">
            <div class="section-title">LISTS</div>
            <ul class="nav-list" id="listsContainer">
              <li class="nav-item" data-list="Personal">
                <span class="nav-label"><span class="color-sq yellow"></span> Personal</span>
                <span class="count-badge">3</span>
              </li>
              <li class="nav-item" data-list="Work">
                <span class="nav-label"><span class="color-sq cyan"></span> Work</span>
                <span class="count-badge">3</span>
              </li>
              <li class="nav-item" data-list="List 1">
                <span class="nav-label"><span class="color-sq orange"></span> List 1</span>
                <span class="count-badge">3</span>
              </li>
            </ul>
            <button class="add-item-btn" id="addNewListBtn">+ Add New List</button>
          </div>

          <!-- Tags Section -->
          <div class="nav-section">
            <div class="section-title">TAGS</div>
            <div class="tags-container" id="tagsContainer">
              <span class="tag-pill cyan">Tag 1</span>
              <span class="tag-pill pink">Tag 2</span>
              <button class="add-tag-btn" id="addNewTagBtn">+ Add Tag</button>
            </div>
          </div>
        </div>

        <!-- Sidebar Footer -->
        <div class="sidebar-footer">
          <button class="footer-link"><span class="icon">⚙</span> Settings</button>
          <button class="footer-link"><span class="icon">🚪</span> Sign out</button>
        </div>
      </aside>

      <!-- Right Main Content Canvas -->
      <main class="main-content">
        <header class="main-header">
          <h1 id="pageTitle">Sticky Wall</h1>
        </header>

        <!-- Sticky Notes Grid Stream -->
        <div class="sticky-grid" id="stickyGrid">
          <!-- Cards rendered dynamically by app.js -->
        </div>
      </main>

    </div>
  </div>

  <!-- Create/Edit Card Modal -->
  <div class="modal-overlay" id="cardModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">New Sticky Note</h3>
        <button class="close-modal-btn" id="closeModalBtn">&times;</button>
      </div>
      <form id="cardForm">
        <input type="hidden" id="cardId">

        <div class="form-group">
          <label for="cardTitleInput">Title</label>
          <input type="text" id="cardTitleInput" placeholder="Note Title (e.g. Social Media)" required>
        </div>

        <div class="form-group">
          <label for="cardContentInput">Notes / Checklist Items</label>
          <textarea id="cardContentInput" rows="5" placeholder="Enter notes paragraph or hyphenated bullet points:&#10;- Plan social content&#10;- Build content calendar" required></textarea>
        </div>

        <div class="form-group">
          <label>Sticky Card Color</label>
          <div class="color-picker-group">
            <label class="color-option">
              <input type="radio" name="cardColor" value="yellow" checked>
              <span class="color-swatch yellow"></span>
            </label>
            <label class="color-option">
              <input type="radio" name="cardColor" value="cyan">
              <span class="color-swatch cyan"></span>
            </label>
            <label class="color-option">
              <input type="radio" name="cardColor" value="pink">
              <span class="color-swatch pink"></span>
            </label>
            <label class="color-option">
              <input type="radio" name="cardColor" value="orange">
              <span class="color-swatch orange"></span>
            </label>
            <label class="color-option">
              <input type="radio" name="cardColor" value="green">
              <span class="color-swatch green"></span>
            </label>
            <label class="color-option">
              <input type="radio" name="cardColor" value="purple">
              <span class="color-swatch purple"></span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="cardListSelect">List Category</label>
          <select id="cardListSelect">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="List 1">List 1</option>
          </select>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="btn-save">Save Note</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Pure JS Script -->
  <script src="app.js"></script>
</body>
</html>
